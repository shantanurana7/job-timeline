version: '3.9'

# ──────────────────────────────────────────────────────────────────
# Job Assigning Timeline Management Platform — Local Dev Stack
# Zero Cost · Zero Card · Zero Signup
# Start everything: docker compose up -d
# ──────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: timeline_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: job_timeline_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localdev123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d job_timeline_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: timeline_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin 4 (DB UI) ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: timeline_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ── RedisInsight (Redis UI) ────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: timeline_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  # ── MailHog (Email Testing) ────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: timeline_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — NestJS sends email here
      - "8025:8025"   # Web UI — http://localhost:8025 to read emails

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
